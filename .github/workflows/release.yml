# Actions → Release → Run workflow (on master) releases the version in package.json:
# it runs CI, creates the tag v<version> and a GitHub release with both zips, then publishes to
# the Chrome Web Store (which Edge, Brave and other Chromium browsers install from too) and
# addons.mozilla.org.
#
# A store is skipped (with a warning) until its secrets are set; see CONTRIBUTING.md. Re-running
# for a version that already has a release skips the release and only retries the stores.
name: Release

on:
  workflow_dispatch:

concurrency: release

jobs:
  ci:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: knobdeck-browser-companion
          path: dist
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            released=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            if [ "$released" != "$GITHUB_SHA" ]; then
              # A retry after a workflow fix lands here too, so don't fail: the stores skip what they have.
              echo "::warning::$tag was released from ${released:0:7}, not this commit. Nothing new ships unless you bump the version in package.json; retrying the stores for $tag only."
            else
              echo "::notice::$tag is already released; retrying the stores only"
            fi
            exit 0
          fi
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > notes.md
          gh release create "$tag" dist/*.zip --target "$GITHUB_SHA" \
            --title "KnobDeck Browser Companion $VERSION" --notes-file notes.md

  chrome:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    env:
      CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
    steps:
      - name: Check the store is set up
        id: setup
        run: |
          if [ -n "$CWS_SERVICE_ACCOUNT_KEY" ] && [ -n "$CWS_PUBLISHER_ID" ] && [ -n "$CWS_EXTENSION_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Chrome Web Store skipped: set CWS_SERVICE_ACCOUNT_KEY, CWS_PUBLISHER_ID and CWS_EXTENSION_ID"
          fi
      - uses: actions/download-artifact@v4
        if: steps.setup.outputs.ready
        with:
          name: knobdeck-browser-companion
          path: dist
      - uses: google-github-actions/auth@v2
        if: steps.setup.outputs.ready
        id: auth
        with:
          credentials_json: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Upload and submit for review
        if: steps.setup.outputs.ready
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          base="https://chromewebstore.googleapis.com"
          item="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"
          zip=$(ls dist/knobdeck-browser-companion-chrome-*.zip)
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/zip" \
            --data-binary "@$zip" "$base/upload/v2/$item:upload" | tee upload.json
          # The upload is processed asynchronously; wait until it is done before submitting.
          for i in $(seq 30); do
            state=$(jq -r '.uploadState // empty' upload.json)
            [ "$state" = IN_PROGRESS ] || break
            sleep 10
            curl -fsS -H "Authorization: Bearer $TOKEN" "$base/v2/$item:fetchStatus" | tee status.json
            jq '{uploadState: .lastAsyncUploadState}' status.json > upload.json
          done
          state=$(jq -r '.uploadState // empty' upload.json)
          [ "$state" = SUCCEEDED ] || { echo "::error::upload state: $state"; exit 1; }
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{}' "$base/v2/$item:publish"

  firefox:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Check the store is set up
        id: setup
        run: |
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::addons.mozilla.org skipped: set AMO_JWT_ISSUER and AMO_JWT_SECRET"
          fi
      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready
      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: steps.setup.outputs.ready
        with:
          name: knobdeck-browser-companion
          path: dist
      - name: Submit to addons.mozilla.org (listed)
        if: steps.setup.outputs.ready
        run: |
          mkdir -p dist/firefox
          unzip -q dist/knobdeck-browser-companion-firefox-*.zip -d dist/firefox
          # amo-metadata.json fills in what a brand-new listing needs; AMO ignores it for updates.
          # A re-run for a version AMO already has (to retry another store) is not an error.
          status=0
          npx --yes web-ext@8 sign --channel listed --source-dir dist/firefox \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
            --amo-metadata store/amo-metadata.json --approval-timeout 0 --artifacts-dir web-ext-artifacts \
            > sign.log 2>&1 || status=$?
          cat sign.log
          if [ "$status" -ne 0 ]; then
            grep -qi "already exists" sign.log || exit "$status"
            echo "::notice::addons.mozilla.org already has this version; nothing to do"
          fi

  catalog:
    # Tells the knobdeck-registry catalog to rebuild. Skipped until the catalog GitHub App is set up
    # (CATALOG_APP_ID variable, CATALOG_APP_PRIVATE_KEY secret). Runs even when a store job failed,
    # because the GitHub release already exists.
    needs: [release, chrome, firefox]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Catalog app token
        id: app
        if: vars.CATALOG_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CATALOG_APP_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          owner: Knobdeck
          repositories: knobdeck-registry
      - name: Tell the catalog
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg id "browser" --arg version "$VERSION" \
            '{event_type: "companion-released", client_payload: {repo: $repo, id: $id, version: $version}}' |
            gh api repos/Knobdeck/knobdeck-registry/dispatches --input -
